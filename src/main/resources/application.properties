spring.application.name=ModeliaBackend

# ══════════════════════════════════════════════
# BASE DE DATOS — LOCAL (descomentar para STS)
# ══════════════════════════════════════════════
#spring.datasource.url=jdbc:mariadb://localhost:3306/modelia_db
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ══════════════════════════════════════════════
# BASE DE DATOS — RAILWAY (activo en producción)
# ══════════════════════════════════════════════
spring.datasource.url=${DATABASE_URL:jdbc:mariadb://localhost:3306/modelia_db}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ══════════════════════════════════════════════
# JPA
# ══════════════════════════════════════════════
# validate → Railway (las tablas las crea Hibernate con update)
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ══════════════════════════════════════════════
# SERVIDOR
# ══════════════════════════════════════════════
server.port=8080

# ══════════════════════════════════════════════
# JWT
# ══════════════════════════════════════════════
jwt.secret=${JWT_SECRET:0ccb841f87a2c46ecc843f46eb081b56}
jwt.expiration-ms=28800000
jwt.refresh-expiration-ms=7776000000

# ══════════════════════════════════════════════
# SWAGGER
# ══════════════════════════════════════════════
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tryItOutEnabled=true

# ══════════════════════════════════════════════
# GLB ESTÁTICOS
# ══════════════════════════════════════════════
spring.web.resources.static-locations=file:./modelos3d/,classpath:/static/